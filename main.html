<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Car Insurance Registration Form
</title>
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>Car Insurance Registration Form
</h1>
	 <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="name" required />
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email" required />
        <br>
        <label for="gender">Gender:</label>
        <br>
        <input type="radio" value="male" name="gender" required /> Male
        <br>
        <input type="radio" value="female" name="gender" required /> Female
        <br>
        <label for="car">Car Brands:
            <select name="cars" id="cars">
                <option value="BMW">BMW</option>
                <option value="Audi">Audi</option>
                <option value="Mercedez">Mercedez</option>
            </select>
        </label>
        <br>
        <label for="carage">Car Age:</label>
        <input type="number" id="carage" name="carage" required />
        <br>
        <label for="dop">Date of Purchase:</label>
        <input type="date" id="dop" name="dop" required />
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" required />
        <br>
        <button type="submit">Submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
